[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pasqa"
version = "0.1.0"
description = "Inference package for the Pitch-Accent Quality Assessment Model"
requires-python = ">=3.9,<3.13"
dependencies = [
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "soundfile",
    "s3prl==0.4.10",
    "pyyaml",
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pasqa"]
